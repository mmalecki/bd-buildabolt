[project]
name = "bd-buildabolt"
version = "0.0.0"
description = "Standard fastener holes and nut pockets for build123d"
authors = [{ name = "Maciej Małecki", email = "me@mmalecki.com" }]
readme = "README.md"
license = "MIT AND LGPL-2.1-or-later"
license-files = [
    "LICENSE",
    "LICENSES/LGPL-2.1-or-later.txt",
]
requires-python = ">=3.11,<3.15"
dependencies = ["build123d>=0.13,<0.14"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
